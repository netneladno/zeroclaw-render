[web_search]
enabled = false
search_provider = "tavily"
tavily_api_key = "${TAVILY_API_KEY}"

[mcp]
enabled = true

[[mcp.servers]]
name = "tavily"
enabled = true
transport = "sse"
url = "https://mcp.tavily.com/mcp/?tavilyApiKey=${TAVILY_API_KEY}"
