app = "zeroclaw-app"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8300"

[mounts]
  source = "zeroclaw_data"
  destination = "/root/.zeroclaw"

[[services]]
  protocol = "tcp"
  internal_port = 8300

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "15s"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
